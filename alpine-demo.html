<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bie-dropdown + Alpine.js</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 40px;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 { font-size: 20px; }
      .demo { margin-bottom: 40px; }
      .demo label {
        display: block; font-size: 13px; font-weight: 600;
        margin-bottom: 8px; color: #555;
      }
      .result { margin-top: 10px; font-size: 13px; color: #666; }
    </style>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    <h1>bie-dropdown + Alpine.js</h1>

    <!-- Demo 1: Static items from Alpine data -->
    <div class="demo" x-data="staticDemo">
      <label>Static items (from Alpine x-data)</label>
      <bie-dropdown
        x-ref="dd"
        x-effect="$refs.dd.items = users"
        @change="selected = $event.target.selected"
        placeholder="Choose user..."
      ></bie-dropdown>
      <div class="result" x-show="selected">
        Selected:
        <span x-text="selected?.name"></span>
        (<span x-text="selected?.email"></span>)
      </div>
    </div>

    <!-- Demo 2: Async loader from Alpine -->
    <div class="demo" x-data="asyncDemo">
      <label>Async loader (JSONPlaceholder via Alpine)</label>
      <bie-dropdown
        x-ref="dd"
        x-init="$refs.dd.items = loadUsers"
        @change="selected = $event.target.selected"
        placeholder="Fetching from API..."
        search-debounce="300"
      ></bie-dropdown>
      <div class="result" x-show="selected">
        Selected:
        <span x-text="selected?.name"></span>
        —
        <span x-text="selected?.email"></span>
      </div>
    </div>

    <!-- Demo 3: Cascading dropdown -->
    <div class="demo" x-data="cascadingDemo">
      <label>Cascading Dropdown — Parent (Country)</label>
      <bie-dropdown
        id="alpine-country"
        x-ref="country"
        x-effect="$refs.country.items = countries"
        @change="selectedCountry = $event.target.selected"
        placeholder="Select country..."
      ></bie-dropdown>
      <div class="result" x-show="selectedCountry">
        Selected country:
        <span x-text="selectedCountry?.name"></span>
      </div>

      <label style="margin-top: 16px;">Cascading Dropdown — Child (City, depends on Country)</label>
      <bie-dropdown
        id="alpine-city"
        x-ref="city"
        depends-on="#alpine-country"
        parent-key="id"
        empty-message="Please select a country first"
        search-debounce="200"
        @change="selectedCity = $event.target.selected"
        placeholder="Select city..."
      ></bie-dropdown>
      <div class="result" x-show="selectedCity">
        Selected city:
        <span x-text="selectedCity?.name"></span>
      </div>
    </div>

    <script type="module">
      import './src/index.ts';
    </script>

    <script>
      // Demo 1: Static items from Alpine
      document.addEventListener('alpine:init', () => {
        Alpine.data('staticDemo', () => ({
          users: [
            { id: 1, name: 'John Doe', email: 'john@example.com' },
            { id: 2, name: 'Jane Smith', email: 'jane@example.com' },
            { id: 3, name: 'Michael Scott', email: 'michael@dm.com' },
            { id: 4, name: 'Dwight Schrute', email: 'dwight@dm.com' },
            { id: 5, name: 'Jim Halpert', email: 'jim@dm.com' },
          ],
          selected: null,
        }));
      });

      // Demo 2: Async loader from Alpine
      document.addEventListener('alpine:init', () => {
        let cached = null;

        Alpine.data('asyncDemo', () => ({
          selected: null,

          async loadUsers(query) {
            // Fetch once from JSONPlaceholder, cache for next searches
            if (!cached) {
              const res = await fetch(
                'https://jsonplaceholder.typicode.com/users'
              );
              cached = await res.json();
            }

            const q = query.toLowerCase();
            return cached.filter(
              (u) =>
                u.name.toLowerCase().includes(q) ||
                u.email.toLowerCase().includes(q) ||
                u.username.toLowerCase().includes(q)
            );
          },
        }));
      });

      // Demo 3: Cascading dropdown
      document.addEventListener('alpine:init', () => {
        const cities = {
          us: [
            { id: 'nyc', name: 'New York City' },
            { id: 'la', name: 'Los Angeles' },
            { id: 'chi', name: 'Chicago' },
          ],
          uk: [
            { id: 'lon', name: 'London' },
            { id: 'man', name: 'Manchester' },
            { id: 'liv', name: 'Liverpool' },
          ],
          jp: [
            { id: 'tok', name: 'Tokyo' },
            { id: 'osa', name: 'Osaka' },
            { id: 'kyo', name: 'Kyoto' },
          ],
        };

        Alpine.data('cascadingDemo', () => ({
          countries: [
            { id: 'us', name: 'United States' },
            { id: 'uk', name: 'United Kingdom' },
            { id: 'jp', name: 'Japan' },
          ],
          selectedCountry: null,
          selectedCity: null,
        }));

        // Wire up the child loader imperatively after Alpine init
        document.addEventListener('alpine:initialized', () => {
          const cityDropdown = document.getElementById('alpine-city');
          if (cityDropdown) {
            cityDropdown.items = async (query, countryId) => {
              if (!countryId) return [];
              await new Promise((r) => setTimeout(r, 300));
              const list = cities[countryId] || [];
              if (!query) return list;
              const q = query.toLowerCase();
              return list.filter((c) => c.name.toLowerCase().includes(q));
            };
          }
        });
      });
    </script>
  </body>
</html>

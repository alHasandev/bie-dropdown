<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIE Dropdown — Dev Preview</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 40px;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 24px;
      }
      .demo-group {
        margin-bottom: 40px;
      }
      .demo-group > label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #555;
      }
      .result {
        margin-top: 10px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>BIE Dropdown — Dev Preview</h1>

    <!-- Demo 1: Basic searchable dropdown -->
    <div class="demo-group">
      <label>Basic Searchable Dropdown</label>
      <bie-dropdown id="demo1" placeholder="Choose user..."></bie-dropdown>
      <div class="result" id="result1"></div>
    </div>

    <!-- Demo 2: Dark themed -->
    <div class="demo-group">
      <label>Dark Themed</label>
      <bie-dropdown
        id="demo2"
        style="
          --bie-bg: #1e1e2e;
          --bie-border: #45475a;
          --bie-text: #cdd6f4;
          --bie-hover-bg: #313244;
          --bie-focus-ring: #cba6f7;
        "
      ></bie-dropdown>
      <div class="result" id="result2"></div>
    </div>

    <!-- Demo 3: Non-searchable -->
    <div class="demo-group">
      <label>Non-searchable</label>
      <bie-dropdown id="demo3" searchable="false"></bie-dropdown>
      <div class="result" id="result3"></div>
    </div>

    <!-- Demo 4: Custom label key -->
    <div class="demo-group">
      <label>Custom Label Key (display "email")</label>
      <bie-dropdown id="demo4" label-key="email" search-placeholder="Search email..."></bie-dropdown>
      <div class="result" id="result4"></div>
    </div>

    <!-- Demo 5: Async loader (simulated API) -->
    <div class="demo-group">
      <label>Async Loader (simulated 500ms API)</label>
      <bie-dropdown id="demo5" placeholder="Search users via API..." search-debounce="400"></bie-dropdown>
      <div class="result" id="result5"></div>
    </div>

    <!-- Demo 6: JSONPlaceholder API -->
    <div class="demo-group">
      <label>JSONPlaceholder API (https://jsonplaceholder.typicode.com/users)</label>
      <bie-dropdown id="demo6" placeholder="Fetching from real API..." search-debounce="300"></bie-dropdown>
      <div class="result" id="result6"></div>
    </div>

    <!-- Demo 7: Cascading / Dependent Dropdown -->
    <div class="demo-group">
      <label>Cascading Dropdown — Parent (Country)</label>
      <bie-dropdown id="demo7-parent" placeholder="Select country..."></bie-dropdown>
      <div class="result" id="result7-parent"></div>
    </div>

    <div class="demo-group">
      <label>Cascading Dropdown — Child (City, depends on Country)</label>
      <bie-dropdown
        id="demo7-child"
        placeholder="Select city..."
        depends-on="#demo7-parent"
        parent-key="id"
        empty-message="Please select a country first"
        search-debounce="200"
      ></bie-dropdown>
      <div class="result" id="result7-child"></div>
    </div>

    <script type="module">
      import './src/index.ts';

      const users = [
        { id: 1, name: 'John Doe', email: 'john@example.com' },
        { id: 2, name: 'Jane Smith', email: 'jane@example.com' },
        { id: 3, name: 'Michael Scott', email: 'michael@dundermifflin.com' },
        { id: 4, name: 'Dwight Schrute', email: 'dwight@dundermifflin.com' },
        { id: 5, name: 'Jim Halpert', email: 'jim@dundermifflin.com' },
        { id: 6, name: 'Pam Beesly', email: 'pam@dundermifflin.com' },
        { id: 7, name: 'Ryan Howard', email: 'ryan@dundermifflin.com' },
        { id: 8, name: 'Kelly Kapoor', email: 'kelly@dundermifflin.com' },
        { id: 9, name: 'Stanley Hudson', email: 'stanley@dundermifflin.com' },
        { id: 10, name: 'Kevin Malone', email: 'kevin@dundermifflin.com' },
      ];

      const countries = [
        { id: 'us', name: 'United States' },
        { id: 'uk', name: 'United Kingdom' },
        { id: 'jp', name: 'Japan' },
      ];

      const cities = {
        us: [
          { id: 'nyc', name: 'New York City' },
          { id: 'la', name: 'Los Angeles' },
          { id: 'chi', name: 'Chicago' },
        ],
        uk: [
          { id: 'lon', name: 'London' },
          { id: 'man', name: 'Manchester' },
          { id: 'liv', name: 'Liverpool' },
        ],
        jp: [
          { id: 'tok', name: 'Tokyo' },
          { id: 'osa', name: 'Osaka' },
          { id: 'kyo', name: 'Kyoto' },
        ],
      };

      // Demo 1
      const demo1 = document.getElementById('demo1');
      demo1.items = users;
      demo1.addEventListener('bie-change', (e) => {
        document.getElementById('result1').textContent =
          e.detail ? `Selected: ${e.detail.name} (${e.detail.email})` : '';
      });

      // Demo 2
      const demo2 = document.getElementById('demo2');
      demo2.items = users;
      demo2.placeholder = 'Dark theme dropdown';
      demo2.addEventListener('bie-change', (e) => {
        document.getElementById('result2').textContent =
          e.detail ? `Selected: ${e.detail.name}` : '';
      });

      // Demo 3
      const demo3 = document.getElementById('demo3');
      demo3.items = users;
      demo3.placeholder = 'No search, just pick';
      demo3.addEventListener('bie-change', (e) => {
        document.getElementById('result3').textContent =
          e.detail ? `Selected: ${e.detail.name}` : '';
      });

      // Demo 4
      const demo4 = document.getElementById('demo4');
      demo4.items = users;
      demo4.placeholder = 'Displaying email...';
      demo4.addEventListener('bie-change', (e) => {
        document.getElementById('result4').textContent =
          e.detail ? `Selected: ${e.detail.email}` : '';
      });

      // Demo 5: Async loader — simulates API call
      const demo5 = document.getElementById('demo5');
      demo5.items = async (query) => {
        // Simulate network delay
        await new Promise((r) => setTimeout(r, 500));

        const q = query.toLowerCase();
        return users.filter(
          (u) =>
            u.name.toLowerCase().includes(q) ||
            u.email.toLowerCase().includes(q)
        );
      };
      demo5.addEventListener('bie-change', (e) => {
        document.getElementById('result5').textContent =
          e.detail ? `Selected: ${e.detail.name}` : '';
      });

      // Demo 6: JSONPlaceholder real API
      const demo6 = document.getElementById('demo6');
      let _cachedUsers = null;

      demo6.items = async (query) => {
        // Fetch once, cache for subsequent searches
        if (!_cachedUsers) {
          const res = await fetch(
            'https://jsonplaceholder.typicode.com/users'
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          _cachedUsers = await res.json();
        }

        const q = query.toLowerCase();
        return _cachedUsers.filter(
          (u) =>
            u.name.toLowerCase().includes(q) ||
            u.email.toLowerCase().includes(q) ||
            u.username.toLowerCase().includes(q)
        );
      };

      demo6.addEventListener('bie-change', (e) => {
        document.getElementById('result6').textContent =
          e.detail ? `Selected: ${e.detail.name} (@${e.detail.username})` : '';
      });

      // Demo 7: Cascading dropdown
      const demo7Parent = document.getElementById('demo7-parent');
      demo7Parent.items = countries;
      demo7Parent.addEventListener('bie-change', (e) => {
        document.getElementById('result7-parent').textContent =
          e.detail ? `Selected country: ${e.detail.name}` : '';
      });

      const demo7Child = document.getElementById('demo7-child');
      demo7Child.items = async (query, countryId) => {
        if (!countryId) return [];
        // Simulate network delay
        await new Promise((r) => setTimeout(r, 300));
        const list = cities[countryId] || [];
        if (!query) return list;
        const q = query.toLowerCase();
        return list.filter((c) => c.name.toLowerCase().includes(q));
      };
      demo7Child.addEventListener('bie-change', (e) => {
        document.getElementById('result7-child').textContent =
          e.detail ? `Selected city: ${e.detail.name}` : '';
      });
    </script>
  </body>
</html>
